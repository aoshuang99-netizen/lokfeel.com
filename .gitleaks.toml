# gitleaks 配置 —— 密钥扫描（P1-8）
# 文档：https://github.com/gitleaks/gitleaks
#
# 目标：在任何凭证进入版本控制之前就把它拦下来。
# 本仓库的历史提交中曾清理过硬编码密钥（见提交 b111e17），
# 因此 enable-rule 与 allowlist 需要同时覆盖"新提交"与"历史扫描"。

title = "LokFeel secret scanning policy"

[extend]
# 在 gitleaks 官方默认规则集之上扩展
useDefault = true

# ══════════════════════════════════════════════════════════════
# 自定义规则：本仓库实际使用的服务商
# ══════════════════════════════════════════════════════════════

[[rules]]
id = "lokfeel-creem-api-key"
description = "Creem 支付 API Key"
regex = '''(?i)creem[a-z_]*?(?:api[_-]?key|token|secret)["'\s:=]{1,6}([a-z0-9_\-]{20,})'''
secretGroup = 1
tags = ["payment", "creem"]

[[rules]]
id = "lokfeel-generic-webhook-secret"
description = "通用 webhook signing secret（支付回调签名密钥）"
regex = '''(?i)(?:webhook|signing)[_-]?secret["'\s:=]{1,6}([a-zA-Z0-9_\-]{16,})'''
secretGroup = 1
tags = ["payment", "webhook"]

[[rules]]
id = "lokfeel-turso-token"
description = "Turso / libSQL 认证 token"
regex = '''(?i)turso[a-z_]*?(?:auth[_-]?)?token["'\s:=]{1,6}([a-zA-Z0-9_.\-]{20,})'''
secretGroup = 1
tags = ["database", "turso"]

[[rules]]
# 2026-11-07：`'<product-password-literal>'` 在 public 仓库里以字面量存在了 6 个提交，
# 且生产账号当时**仍可用它登录**。默认规则集抓不到"域名风格的弱口令"，
# 所以补一条针对本产品命名习惯的规则。
id = "lokfeel-product-password-literal"
description = "LokFeel 账号密码字面量（形如 LokFeel@...）"
regex = '''(?i)["'\s:=]LokFeel@[A-Za-z0-9!@#$%^&*_-]{6,}'''
tags = ["credential", "lokfeel"]

# 注：曾考虑再加一条通用规则 `password\s*[:=]\s*"字面量"`，实测 30+ 误报
# （zod 的 `password: 'reg-password'`、`password: 'MAGIC_LINK_AUTH'`、e2e 假账号）。
# 误报多的门禁会被忽略，所以这条**不进** gitleaks；同一意图由
# scripts/check-secrets.mjs 的 G2（只认凭据类变量名的 `|| '字面量'`，零误报）覆盖。

[[rules]]
id = "lokfeel-neon-connection-string"
description = "含密码的 PostgreSQL 连接串（Neon 等）"
regex = '''postgres(?:ql)?://[^:]+:([^@\s"']{8,})@[^\s"']+'''
secretGroup = 1
tags = ["database", "connection-string"]

[[rules]]
id = "lokfeel-nextauth-secret"
description = "NextAuth / Auth.js 会话加密密钥"
regex = '''(?i)(?:nextauth|auth)[_-]?secret["'\s:=]{1,6}([a-zA-Z0-9+/=_\-]{24,})'''
secretGroup = 1
tags = ["auth"]

[[rules]]
id = "lokfeel-vercel-oidc-token"
description = "Vercel OIDC / 部署 token"
regex = '''(?i)vercel[a-z_]*?(?:oidc[_-]?)?token["'\s:=]{1,6}([a-zA-Z0-9_.\-]{20,})'''
secretGroup = 1
tags = ["deploy", "vercel"]

[[rules]]
id = "lokfeel-cloudflare-api-token"
description = "Cloudflare API Token"
regex = '''(?i)(?:cloudflare|cf)[a-z_]*?(?:api[_-]?)?token["'\s:=]{1,6}([a-zA-Z0-9_\-]{30,})'''
secretGroup = 1
tags = ["deploy", "cloudflare"]

[[rules]]
id = "lokfeel-stripe-secret-key"
description = "Stripe 密钥（live / test）"
regex = '''(?:sk|rk)_(?:live|test)_[a-zA-Z0-9]{20,}'''
tags = ["payment", "stripe"]

# ─── D-09 补齐：历史上登记缺失的 4 类前缀（2026-11-05 新增）───
[[rules]]
id = "lokfeel-workbuddy-publishable-key"
description = "WorkBuddy 应用级 publishable key（wbpk_…），见 src/lib/agent/provider.ts"
regex = '''(?i)wbpk_[A-Za-z0-9_\-]{16,}'''
tags = ["workbuddy", "publishable-key"]

[[rules]]
id = "lokfeel-github-pat"
description = "GitHub Personal Access Token（ghp_/gho_/ghu_/ghs_/ghr_/ghf_）"
regex = '''gh[pousrf]_[A-Za-z0-9]{36,}'''
tags = ["github", "token"]

[[rules]]
id = "lokfeel-nfp-token"
description = "nfp_ 前缀凭据"
regex = '''(?i)nfp_[A-Za-z0-9_\-]{16,}'''
tags = ["token", "nfp"]

[[rules]]
id = "lokfeel-re-scoped-token"
description = "re_<scope>_<secret> 形态的定制令牌"
regex = '''re_[A-Za-z0-9]+_[A-Za-z0-9_\-]{16,}'''
tags = ["token", "custom"]

[[rules]]
id = "lokfeel-sk-dash-key"
description = "sk- 前缀密钥（非 Stripe 的其它服务商形态）"
regex = '''sk-[A-Za-z0-9]{24,}'''
tags = ["secret", "sk-dash"]

# ══════════════════════════════════════════════════════════════
# 白名单：这些路径/模式不是真实凭证，避免误报阻塞 CI
# ══════════════════════════════════════════════════════════════

[allowlist]
description = "排除模板、示例、测试夹具与文档中的占位值；以及已轮换的历史泄漏提交"

# ── 历史 commits ───────────────────────────────────────────────────────
# 2026-11-07 发现两个口令字面量已进入 public 仓库历史。处置是**轮换凭据**，
# 不是改写历史：public 仓库一旦被 clone/fork/镜像/搜索引擎收录，改写只能让
# 「本仓库看不到」，不能让「别人手上的副本消失」。凭据已全部失效（见
# docs/implementation/v20/ga/01_SECURITY_CREDENTIAL_RECOVERY.md），因此这些
# 提交里的字面量不再是活的秘密，列入 allowlist 以免 CI 永久恒红。
# 新增提交**不在**此列 —— 新泄漏必须让 CI 红。
commits = [
  # 产品管理员口令字面量
  "56fd575d300eb1000138d98ac000b4b0c89b100e",
  "57e0b3fca449eb59d906d5d247c150ce92187bb4",
  "ca9f5c02aa243e80a6802f5f435dead0ad01a733",
  "e5e884691dfc1c45f32a97194375332440b79c99",
  "f7f90ba78ac90d25f696079880c774c6f3064c3b",
  "7f0ff4a01c7d01c7c5637aab2a579edb37cb674b",
  # 测试账号口令字面量
  "5639495f9786ab8a3a3c4cdddddfb33c0bd4e4d8",
  "6660a3315254649dd1490ae984f61a53edcb0548",
  "f7d889064858f6a7be2b7c4e91de886b9eb78c82",
]

# 允许整类路径跳过扫描
paths = [
  '''\.env\.example$''',
  '''\.env\.local\.template$''',
  '''\.env\.template$''',
  '''\.env\..*\.example$''',
  '''^docs/''',
  '''^tests/fixtures/''',
  '''^prisma/migrations/''',
  '''package-lock\.json$''',
  '''^src/generated/''',
  '''\.md$''',
]

# 允许特定"看起来像密钥但其实是占位符"的字符串
regexes = [
  '''(?i)(placeholder|example|changeme|your[_-]?key|dummy|fake|test[_-]?only|xxxx+|\*\*\*+)''',
  '''(?i)ci-placeholder-secret-not-used-in-production''',
  '''process\.env\.[A-Z_]+''',
  '''sk_test_placeholder''',
]
