# /etc/cloudflared/config.yml — LokFeel 回源
# 校验：cloudflared tunnel ingress validate
#       cloudflared tunnel ingress rule https://app.lokfeel.com/api/health
# <UUID> 与凭据文件名必须与实际一致；凭据 600，永不入 git。

tunnel: <UUID>
credentials-file: /etc/cloudflared/<UUID>.json
retries: 5
grace-period: 30s

ingress:
  # Next.js standalone 直接监听 127.0.0.1:3000（不额外加 nginx）
  # 若后面要加 nginx，把 service 改成 http://127.0.0.1:8080
  - hostname: app.lokfeel.com
    service: http://127.0.0.1:3000
    originRequest:
      connectTimeout: 15s
      keepAliveConnections: 64
      keepAliveTimeout: 90s
      # 长 AI 请求：CF 免费/Pro 回源上限 100s，这里放宽只影响本地等待，不改变 524
      httpHostHeader: app.lokfeel.com
      noHappyEyeballs: false
      disableChunkedEncoding: false

  # 若 apex 也从 Netlify 迁过来，再加一条；未迁时不要配，避免把营销页打空
  # - hostname: lokfeel.com
  #   service: http://127.0.0.1:3000

  - service: http_status:404
