negativeControls:
  - "零候选不得生成假用户/假照片/假分数填屏"
  - "单方同意不得 dispatch；撤回与并发发送必须 fail-closed"
  - "拉黑后新增提案/消息/介绍全部 403"
  - "provider SENT 不得标 MEETING_COMPLETED"
  - "Mission CLOSED / Agent EXECUTED / ExecutionVerification 不得判 Verified Introduction"
  - "匿名 401 不代替已登录 503；200 JSON 不得暗泄未批价格"
