name: GCP console key restrict (1.3)

# 为什么放在这里跑：本机对 Google 全系域名不通（GFW），而 Cloud Console 只能从
# 能直连 Google 的网络访问。美区 runner 提供该出口；登录态由 secrets.GCP_SESSION_COOKIES
# （本机 Chrome 解密出的会话 cookie）注入，脚本不打印任何 cookie 值。
#
# 本工作流只读该 secret，不做任何写库/部署动作；提交信息带 [skip netlify] 以免触发构建。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = 只探测登录态与页面结构；apply = 执行限制修改'
        required: true
        default: 'probe'
        type: choice
        options: [probe, apply]
      target_url:
        description: 'Cloud Console 目标页 URL'
        required: true
        default: 'https://console.cloud.google.com/apis/credentials/key/2b6e641d-3616-461b-9a31-5dcd229e3f20?project=project-1700929385257882331'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Playwright（隔离目录，不动仓库依赖）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm i playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1 || true
          echo "playwright 就绪"

      - name: 执行
        env:
          GCP_SESSION_COOKIES: ${{ secrets.GCP_SESSION_COOKIES }}
          TARGET_URL: ${{ inputs.target_url }}
          MODE: ${{ inputs.mode }}
        run: |
          NODE_PATH=/tmp/pw/node_modules node scripts/gcp-console-key.cjs

      - name: 上传截图与页面快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-console-shots
          path: |
            gcp-shots/
          if-no-files-found: ignore
          retention-days: 14
