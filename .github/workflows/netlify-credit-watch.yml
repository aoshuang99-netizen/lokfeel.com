name: Netlify credit watch

# Netlify 额度看护：每日自动巡检构建额度，异常时开 Issue 告警，恢复后自动关闭。
# 背景：auto recharge 未开启时，额度耗尽会导致整站 503（2026-09-29 真实事故）。
# 本工作流只读 Netlify API，不做任何写操作。token 存于仓库 Secret NETLIFY_AUTH_TOKEN。

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC = 北京时间 09:30
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: netlify-credit-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run credit watchdog
        id: watch
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set +e
          node scripts/netlify-credit-watch.mjs 2>&1 | tee watchdog-output.txt
          rc=${PIPESTATUS[0]}
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"
          echo "watchdog exit code: $rc"

      - name: Alert (create or update issue)
        if: steps.watch.outputs.exitcode != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EXITCODE: ${{ steps.watch.outputs.exitcode }}
        run: |
          gh label create netlify-credits --color D93F0B --description "Netlify 构建额度看护告警" --force
          {
            echo "## Netlify 额度看护告警（退出码 $EXITCODE，1=告警 2=危急）"
            echo
            echo '```'
            cat watchdog-output.txt
            echo '```'
            echo "- 巡检时间: $(date -u '+%F %T') UTC"
            echo "- 运行记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 修复路径见输出末尾（需 Team Owner 在控制台开启 credit auto recharge）"
          } > body.md
          existing=$(gh issue list --label netlify-credits --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "已更新既有告警 Issue #$existing"
          else
            gh issue create --title "🟡 Netlify 额度看护告警（lokfeel.com）" --body-file body.md --label netlify-credits
            echo "已新建告警 Issue"
          fi

      - name: Resolve (auto-close alert issue)
        if: steps.watch.outputs.exitcode == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label netlify-credits --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "✅ 额度状态恢复正常（退出码 0，auto recharge 已开启），本告警自动关闭。"
            echo "已自动关闭告警 Issue #$existing"
          else
            echo "额度正常，且无待关闭的告警 Issue"
          fi
