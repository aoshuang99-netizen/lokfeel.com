name: Cloudflare Production

# V20.2 P0-02（安全隔离）：生产部署**不再**由 push/main 自动触发。
# 普通合并到 main 只会跑 CI（ci.yml）；本流水线只接受显式 workflow_dispatch，
# 且必须输入 confirm=DEPLOY。同时绑定受保护的 GitHub Environment `production`
# （需在仓库 Settings → Environments 配置审批人），未经人工审批不得部署。
# 正式发布仍需 D-10 明确批准（见 V20.2 作战令 Batch 7）。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DEPLOY 以确认正式生产发布（需 D-10 批准）'
        required: true
        default: 'NO'

concurrency:
  group: cf-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  production:
    name: Build & Deploy Production (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 绑定受保护 Environment：只有 confirm=DEPLOY 才放行；Environment 审批人未通过则阻塞
    environment: production
    if: github.event.inputs.confirm == 'DEPLOY'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Verify build artifact
        run: test -f .open-next/worker.js

      - name: Deploy Production
        run: npx opennextjs-cloudflare deploy

      - name: Record deploy SHA
        run: echo "PRODUCTION_DEPLOYED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
