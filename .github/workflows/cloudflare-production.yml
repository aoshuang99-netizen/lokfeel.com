name: Cloudflare Production

# V20.1 P0-02 / P0-08：Cloudflare 生产部署流水线
# 触发器：push 到 main（自动）+ 手动（需输入 DEPLOY 确认）。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（仅 Production 作用域，最小权限）。
# 生产发布仍需 D-10 明确批准（见作战令 P0-08）；本流水线本身不替代人工批准，
# 手动触发要求输入 confirm=DEPLOY 作为二次确认。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DEPLOY 以确认正式生产发布（需 D-10 批准）'
        required: true
        default: 'NO'

concurrency:
  group: cf-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  production:
    name: Build & Deploy Production (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 手动触发必须显式确认；push 到 main 自动执行（仍受 D-10 批准约束于流程层面）
    if: github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Verify build artifact
        run: test -f .open-next/worker.js

      - name: Deploy Production
        run: npx opennextjs-cloudflare deploy

      - name: Record deploy SHA
        run: echo "PRODUCTION_DEPLOYED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
