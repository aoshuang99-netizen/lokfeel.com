name: Preview Runtime Audit (P0-3/P0-4)

# 独立 GitHub-hosted Runner 上打开真实 Preview，不依赖本机网络。
# 本 workflow 只做验收与产物上传，不部署、不迁移、不改生产。

on:
  push:
    branches: ['rc/p03-preview-runtime-audit-20261123']
    paths:
      - '.github/workflows/preview-runtime-audit.yml'
      - 'scripts/qa/p03-preview-runtime-audit.mjs'
  workflow_dispatch:
    inputs:
      base_url:
        description: '待验收的真实 URL'
        required: false
        default: 'https://lokfeel-preview.aoshuang99.workers.dev'
      expected_sha:
        description: '期望的运行时提交 SHA'
        required: false
        default: '9bc4fbb7cdc999d5e61814d2bd22967859b964cd'
      allow_writes:
        description: '是否允许写入测试（仅确认隔离库时使用）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: preview-runtime-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Verify preview runtime from independent runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://lokfeel-preview.aoshuang99.workers.dev' }}
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha || '9bc4fbb7cdc999d5e61814d2bd22967859b964cd' }}
      ALLOW_WRITES: ${{ github.event.inputs.allow_writes || 'false' }}
      AUDIT_EMAIL: ${{ secrets.QA_EMAIL || 'qa.male@lokfeel.com' }}
      AUDIT_PASSWORD: ${{ secrets.QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit real deployment
        run: |
          set -o pipefail
          args="--base=$BASE_URL --expected-sha=$EXPECTED_SHA --label=preview --page-timeout=12000 --out=docs/p03-preview-runtime-audit/evidence/preview"
          if [ "$ALLOW_WRITES" = "true" ]; then args="$args --writes"; fi
          node scripts/qa/p03-preview-runtime-audit.mjs $args 2>&1 | tee p03-audit.log

      - name: Publish audit summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = 'docs/p03-preview-runtime-audit/evidence/preview/result.json'
          if (!fs.existsSync(p)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n### P0-3 audit\n\n没有生成 result.json；见 p03-audit.log。\n')
            process.exit(0)
          }
          const j = JSON.parse(fs.readFileSync(p, 'utf8'))
          const failPages = j.pages.filter((x) => x.pass === 'preview' && x.status === 'FAIL')
            .map((x) => `${x.slug}/${x.viewport} http=${x.http} ${(x.pageErrors || []).join('; ')}`)
          const failApi = j.api.filter((x) => x.pass === 'preview' && x.status === 'FAIL')
            .map((x) => `${x.name} http=${x.http || '-'} ${x.reason || ''}`)
          const lines = [
            '',
            '### P0-3 runtime audit summary',
            '',
            `- Verdict: **${j.verdict}**`,
            `- Base: ${j.base}`,
            `- Health/SHA: ${j.health.status} ${j.health.commit || ''} (expected ${j.expectedSha.slice(0, 7)})`,
            `- Login: ${j.login.status} ${j.login.http || ''}`,
            `- Pages: ${JSON.stringify(j.pages.reduce((a, x) => { if (x.pass === 'preview') a[x.status] = (a[x.status] || 0) + 1; return a }, {}))}`,
            `- API: ${j.api.filter((x) => x.pass === 'preview').map((x) => `${x.name}=${x.status}`).join(', ')}`,
            `- CTA: ${j.cta.filter((x) => x.pass === 'preview').map((x) => `${x.name}=${x.status} ${x.reason || ''}`).join(', ')}`,
            `- Failed pages: ${failPages.join(' | ') || 'none'}`,
            `- Failed API: ${failApi.join(' | ') || 'none'}`,
            '',
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'))
          NODE

      - name: Persist audit result to reviewable branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result="docs/p03-preview-runtime-audit/evidence/preview/result.json"
          report="docs/p03-preview-runtime-audit/evidence/preview/report.md"
          if [ ! -f "$result" ]; then echo "没有 result.json，跳过结果分支写入"; exit 0; fi
          branch="audit-results/p03-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -f "$result" "$report"
          if git diff --cached --quiet; then echo "结果无变化"; exit 0; fi
          git commit -m "chore(qa): persist p03 audit result ${{ github.run_id }}"
          git push origin HEAD:"$branch"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p03-preview-runtime-audit
          path: |
            docs/p03-preview-runtime-audit/evidence/preview
            p03-audit.log
          if-no-files-found: warn
          retention-days: 30
