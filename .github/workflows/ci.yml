name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送取消旧运行，节省 CI 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 构建期占位凭证：CI 中不应依赖真实密钥。
  # 若某个任务确实需要真实密钥，请通过 GitHub Secrets 注入，不要写在这里。
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 类型检查 —— 零类型错误是硬门槛
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # 2. Lint —— **棘轮**门禁（AC-23）
  #
  #    背景：本任务曾经直接跑 `npm run lint`（= 裸 `eslint`，扫全仓）。全仓有
  #    ~1.5k 条**历史存量**债（三条规则占 79%），于是这个 job 长期恒红。
  #    恒红 = 没有门禁：真回归会被存量噪音淹掉，久而久之所有人学会忽略它。
  #
  #    现在改成两步：
  #      ① 全仓跑一次 eslint，产出 JSON 报告（**不**据此判红）；
  #      ② `scripts/ci/lint-ratchet.mjs` 拿报告与冻结基线
  #         （docs/implementation/lint-baseline.json）逐文件×逐规则比对 ——
  #         **只有新增才判红**。
  #
  #    规则强度一点没降：基线之外的一切照旧是 error。红 = 你引入的。
  #    为什么是「逐文件×逐规则」而不是「比总数」：只比总数时
  #    「新加 3 条 any、顺手删 3 条旧的」会被判过 —— 那是可被无意（也可被
  #    有意）绕过的假门禁。基线自证里专门有一条测这个（`verify:lint:ratchet`）。
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint · 棘轮)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: 全仓 ESLint（产出报告，不据此判红）
        run: |
          set +e
          npx eslint . -f json > "$RUNNER_TEMP/eslint.json"
          CODE=$?
          # 退出码 1 = 命中存量债（预期）；>1 = eslint 自身/配置故障，必须失败
          if [ "$CODE" -gt 1 ]; then
            echo "::error::eslint 自身失败（退出码 $CODE）"
            exit 1
          fi
          echo "eslint 退出码 $CODE（1 = 命中存量债，属预期）"

      - name: 棘轮门禁（只拦新增债）
        # 明细同时写进 job summary：job 日志的 REST 端点需要仓库写权限，
        # 而 summary 是公开可读的 —— 没有管理员令牌时也能定位「新债在哪一行」。
        run: |
          set +e
          node scripts/ci/lint-ratchet.mjs --report="$RUNNER_TEMP/eslint.json" > "$RUNNER_TEMP/ratchet.log" 2>&1
          CODE=$?
          cat "$RUNNER_TEMP/ratchet.log"
          {
            echo '### lint 棘轮明细（新增债）'
            echo '```'
            tail -n 80 "$RUNNER_TEMP/ratchet.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: ${{ runner.temp }}/eslint.json
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3. 单元 / 集成测试
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --ci --reporters=default

      # 退款链路：真实 Stripe SDK + 真实 HTTP + 本地 Stripe 协议服务端。
      # 不需要任何密钥，所以能进 CI —— 防止「退款只在发布前手验过一次」。
      - name: 退款链路协议层端到端
        run: node scripts/qa/refund-e2e.mjs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 4. 生产构建
  #
  #    `continue-on-error` 已于 2026-10-16（AC-23）**移除**。
  #    依据：CI run 38848356361 中 `Build (next build)` job 结论为
  #    **success**（步骤级全绿），即构建在占位凭证下本就通过 ——
  #    `continue-on-error` 只是历史遗留的免责声明，不是现实。
  #    构建期对真实密钥存在硬依赖的话，这里应当失败并暴露出来。
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 5. 迁移（AC-23 新增）—— **免任何凭据**
  #
  #    CI 原先完全不校验迁移。用 throwaway 的 libSQL 文件库把
  #    「基线 schema → T01 租户批次 → T02–T10 连接批次」整条链跑通，
  #    再复跑一次证明幂等，最后对账 + schema 漂移检查。
  #
  #    这一步的价值：迁移脚本是**手写的 .mjs**（不是 prisma migrate 全部托管），
  #    它们此前只在生产库上被执行过 —— 也就是说「从零能不能建起来」
  #    从来没人验证过。这里补上。
  #
  #    DATABASE_URL 指向 `file:./ci-migrate.db`（provider 本就是 sqlite），
  #    不接触任何远程库、不需要 TURSO_AUTH_TOKEN。
  # ─────────────────────────────────────────────────────────────
  migration:
    name: Migration（libSQL 文件库 · 全批次）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci-migrate.db
      TURSO_AUTH_TOKEN: ''
      DATABASE_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      # 🔴 安全断言：本 job 的迁移脚本**会优先读 .env / .env.local**
      #    （见 scripts/connection/migrate.mjs 的 resolveConnection：`args.url || env.DATABASE_URL || process.env.DATABASE_URL`）。
      #    也就是说，如果仓库里意外有了 .env，或者 DATABASE_URL 被改成了远程库，
      #    下面的 `apply --yes` 就会**对着生产库执行 DDL**。
      #    这里把它钉死：必须是 file: 本地库，且工作区不得存在 .env* 文件。
      - name: 安全断言（必须是本地文件库，且无 .env 干扰）
        run: |
          case "${DATABASE_URL}" in
            file:*) echo "✅ 本地文件库：${DATABASE_URL}" ;;
            *) echo "::error::迁移 job 必须跑在一次性文件库上，当前 DATABASE_URL=${DATABASE_URL}"; exit 1 ;;
          esac
          for f in .env .env.local; do
            if [ -f "$f" ]; then
              echo "::error::工作区存在 $f —— 迁移脚本会优先读它，可能指向远程库。已中止。"
              exit 1
            fi
          done
          echo "✅ 工作区无 .env / .env.local"

      - name: 基线 schema（prisma db push）
        # ⚠️ 为什么不是 `prisma migrate deploy`：
        #    实测在一次性 libSQL 文件库上**从零建库直接失败**（P3018 / near "DO"），
        #    因为 prisma/migrations/20250413130000_... 是 PostgreSQL 专有 SQL
        #    （DO $$ / CREATE TYPE ... AS ENUM / pg_type / information_schema），
        #    而 datasource provider 是 sqlite；且 initial_migration.sql 是空文件。
        #    也就是说「迁移目录」从来不是本项目的建库路径 —— 生产库是 db push 建的。
        #    这里对齐现实。`--accept-data-loss` 只作用于这个一次性库。
        run: npx prisma db push --accept-data-loss

      - name: 回落到 T01 之前的基线（卸掉批次表）
        # 先把批次表 drop 掉，再重建 —— 否则 `CREATE TABLE IF NOT EXISTS`
        # 会让 apply 退化成空操作，这一环就白跑了。
        run: |
          node scripts/tenancy/migrate.mjs rollback --batch=ALL --yes
          node scripts/connection/migrate.mjs rollback --batch=ALL --yes

      - name: T01 租户批次（M0–M2）—— 重建
        run: node scripts/tenancy/migrate.mjs apply --batch=ALL --yes

      - name: T02–T10 连接批次（C0–C9）—— 重建
        run: node scripts/connection/migrate.mjs apply --batch=ALL --yes

      - name: 幂等复跑（重复 apply 必须是空操作）
        run: |
          node scripts/tenancy/migrate.mjs apply --batch=ALL --yes
          node scripts/connection/migrate.mjs apply --batch=ALL --yes

      - name: 对账断言（回读真实表结构）
        run: |
          node scripts/tenancy/migrate.mjs verify
          node scripts/connection/migrate.mjs verify

      - name: schema 漂移棘轮（已知漂移冻结，新增漂移判红）
        run: node scripts/ci/migration-drift-ratchet.mjs

  # ─────────────────────────────────────────────────────────────
  # 6. 端到端冒烟（AC-23 新增）—— 构建产物真启动
  #
  #    ⚠️ 为什么**不**直接跑 `npm run test:e2e`：
  #    `playwright.config.ts` 的 `baseURL` 默认是**生产站**
  #    （https://app.lokfeel.com），且 `tests/e2e/**` 依赖真实测试账号。
  #    拿它当 CI 门禁 = 每次 PR 都去打生产库，既不可重复也不安全。
  #
  #    这里跑的是 `playwright.ci.config.ts` + `tests/e2e-ci/**`：
  #    对**本地构建产物**（`next start`）做真实浏览器冒烟 ——
  #    验证「构建能过」之后应用**真的能起来、真的能路由、守卫真的生效**。
  #    这正是 jest（纯 Node）覆盖不到、而 T12 教训里最易漏的一层。
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E（构建产物 · 浏览器冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./ci-e2e.db
      TURSO_AUTH_TOKEN: ''
      DATABASE_AUTH_TOKEN: ''
      # 冒烟阶段不需要任何外部服务；缺失时应用走降级路径（G-4 已验证）
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: 准备本地库（基线 schema + 全部自定义批次）
        run: |
          npx prisma db push --accept-data-loss
          node scripts/tenancy/migrate.mjs apply --batch=ALL --yes
          node scripts/connection/migrate.mjs apply --batch=ALL --yes

      - name: 生产构建
        run: npm run build

      - name: 启动构建产物
        run: |
          npm run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next-start.pid"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "服务已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::next start 启动超时（60s）"
          tail -100 "$RUNNER_TEMP/next-start.log"
          exit 1

      # 🔴 payment-off 契约（2026-10-18）
      #    「支付未接入」是上线前的合法状态，必须**可运行、可观测**：
      #    支付入口回 503 + PAYMENT_NOT_CONFIGURED（不是 500），
      #    /api/health 汇报还差哪几个变量。本 job 本来就没有支付凭据，正好是真实场景。
      #    防的是两类回归：① 把 503 写回 500（监控会把"未接入"记成故障）；
      #    ② 删掉守卫（缺配置时直连 SDK，抛异常变 500）。
      - name: payment-off 契约（未接入支付是受支持状态）
        run: node scripts/qa/verify-payment-off.mjs --base=http://127.0.0.1:3000

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 浏览器冒烟
        run: npx playwright test --config=playwright.ci.config.ts

      - name: 失败时打印服务端日志
        if: failure()
        run: tail -200 "$RUNNER_TEMP/next-start.log" || true

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ci-report
          path: |
            test-results/ci/
            ${{ runner.temp }}/next-start.log
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 7. 密钥扫描 —— 检出即失败（P1-8）
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 扫描完整历史，防止历史凭证残留

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 组织仓库需要：GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────────────────────
  # 8. 依赖审计 —— **棘轮**门禁（AC-23）
  #
  #    `continue-on-error` 已于 2026-10-16 移除。实测 `npm audit --audit-level=high`
  #    有 34 high / 3 critical，其中**生产可达**（--omit=dev）26 high / 2 critical。
  #    一把梭 `npm audit fix` 实测会动 162 个包、含 `undici 7→8` 这类主版本跃迁，
  #    而且**一条高危都没消掉** —— 直接清是不可能的。
  #
  #    所以这里做两件事：
  #      ① **生产可达**高危走棘轮门禁（`scripts/ci/dependency-ratchet.mjs`）：
  #         基线之外的**新**高危判红；每条被接受的高危**必须有书面豁免**
  #         （reason / disposition / reviewBy），且**复核期限到期判红** ——
  #         不允许「永久豁免」；严重度升级也判红。
  #      ② 全量（含 devDependencies）只打印、**不阻断**：jest / ts-jest /
  #         eslint-config-next 这些不上生产运行时的噪音不该淹掉真正的生产漏洞。
  # ─────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency audit（生产可达 · 棘轮）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: 生产依赖审计（产出报告）
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-prod.json"
          echo "npm audit(prod) 退出码 $?（1 = 有漏洞，属预期）"

      - name: 棘轮门禁（新增 / 未登记豁免 / 豁免到期 → 判红）
        run: node scripts/ci/dependency-ratchet.mjs --report="$RUNNER_TEMP/audit-prod.json" --full

      - name: 上传审计报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: ${{ runner.temp }}/audit-prod.json
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 9. DCO 签署校验 —— 与 CONTRIBUTING.md 第 5 节对应
  # ─────────────────────────────────────────────────────────────
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify every commit has a Signed-off-by line
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::提交 $sha 缺少 DCO 签署行 (Signed-off-by)。请使用 git commit -s"
              MISSING=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::存在未签署 DCO 的提交，详见 CONTRIBUTING.md 第 5 节"
            exit 1
          fi
          echo "所有提交均已正确签署 DCO"

  # ─────────────────────────────────────────────────────────────
  # 10. 性能 SLO 对账 —— **确定性**门禁（AC-24）
  #
  #     为什么这里**只读冻结文件**、不跑压测：
  #       同一份代码在共享 runner 上的实测延迟抖动极大（邻居负载、CPU 配额、
  #       网络）。给延迟挂硬阈值，结果就是随机变红 —— 那正是 AC-23 里
  #       反复强调的「**恒红的门禁比没有门禁更危险**」，它会把「红」这个
  #       信号本身贬值。
  #       但「SLO 定义与**已留存基线**是否自洽」是**确定性**的：谁把 slo.json
  #       改成与基线矛盾、或删掉基线文件，这里立刻判红。零抖动、零成本。
  #
  #     实跑压测走 `workflow_dispatch`（见下一个 job），产出的基线由人工
  #     复核后再提交 —— 压测是**取证动作**，不是**门禁动作**。
  # ─────────────────────────────────────────────────────────────
  slo-check:
    name: Perf SLO 对账（确定性 · AC-24）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # 纯 node 标准库，不需要 npm ci —— 所以这个 job 只要十几秒
      - name: 校验器自证（判红有牙齿 + 非恒红）
        run: node scripts/perf/slo-check.mjs --self-test
      - name: SLO 与留存基线对账
        run: node scripts/perf/slo-check.mjs

  # ─────────────────────────────────────────────────────────────
  # 10bis. 上线预检编排器的**汇总口径**自证
  #
  #     为什么单独设门禁：`npm run check:launch` 的「断言合计」是这个仓库对外
  #     唯一的量化证据。它曾经是「数输出里的对勾」——于是 SLO 一步被算成 52
  #     （脚本自报 48）、发版面算成 9（实际 6+2=8），总数报 150 而文档写 107：
  #     **一个看起来很精确的估数**。现在改成「脚本自报优先，缺失退回近似并标注」，
  #     本 job 就是钉住这条口径：自报行必须压倒文案、缺自报必须判未知、
  #     删掉自报行结果必须翻转（变异对照）。
  #
  #     纯 node 标准库、不联网、不需要任何 secret，约 2 秒。
  # ─────────────────────────────────────────────────────────────
  launch-check-selftest:
    name: 上线预检汇总口径自证
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: 汇总口径自证（自报优先 + 变异对照）
        run: node scripts/qa/launch-check.mjs --self-test

  # ─────────────────────────────────────────────────────────────
  # 10a2. 支付凭据灌注脚本自证
  #
  #      本脚本会**真的写生产环境变量、真的建支付 webhook 端点、真的触发部署**，
  #      所以它自己必须先被钉住：规则是否仍从源码读（而不是悄悄抄了一份）、
  #      Stripe 端点是否带源码钉的 api_version、读回不一致是否判红、
  #      test 凭据写生产是否被拦。全部走本地假服务端，不联网、不花钱。
  # ─────────────────────────────────────────────────────────────
  payment-apply-selftest:
    name: 支付凭据灌注自证
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: 自证（25 条断言，含变异与反向对照）
        run: node scripts/qa/payment-credentials-apply.mjs --self-test

  # ─────────────────────────────────────────────────────────────
  # 10a-2. 租户作用域静态审计（V17 / WB17-01）
  #
  #       withTenant 只保证调用者属于某租户，不保证 SQL 带了租户谓词。
  #       本 job 扫描多租户面上所有对 org 模型的查询，未登记的跨租户风险直接判红。
  #       先跑自证（含 2 条变异 + 1 条反向对照），再对真实仓库 --strict。
  # ─────────────────────────────────────────────────────────────
  tenancy-scoping-gate:
    name: 租户作用域审计（跨租户风险）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: 自证（规则可证伪 + 变异对照）
        run: node scripts/qa/tenant-scoping-audit.mjs --self-test
      - name: 对真实仓库严格扫描
        run: node scripts/qa/tenant-scoping-audit.mjs --strict

  # ─────────────────────────────────────────────────────────────
  # 10b. cron 方法一致性 —— 防「POST 打只导出 GET 的端点」这类静默失效
  #
  #      线上实证（2026-10-20）：netlify/functions/cron-runner.ts 曾统一 POST，
  #      而 bot-tick/bot-online/bot-chat/bot-match/status 只导出 GET ⇒ 405。
  #      405 在日志里长得像"路由不存在"，不会告警，只会"机器人慢慢不动"。
  #      这里做源码级比对：route 的导出方法 vs 调度器的调用方法。
  # ─────────────────────────────────────────────────────────────
  cron-method-gate:
    name: cron 方法一致性（防 405 静默失效）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: 引擎自证（3 条变异必须被抓到）
        run: node scripts/ci/verify-cron-methods.mjs --self-test
      - name: 实检（route 导出 vs 调度器调用）
        run: node scripts/ci/verify-cron-methods.mjs
      - name: systemd cron 生成自证（频率/方法/幂等/退出码）
        run: bash deploy/selfhost/cron/test-cron.sh
      - name: bootstrap 只读自证（绝不开 80/443）
        run: bash deploy/selfhost/test-bootstrap.sh
      - name: Tunnel 安装器自证（prepare 不动 DNS / switch 先备份 / 幂等）
        run: bash deploy/selfhost/test-tunnel.sh
      - name: 环境导出器自证（值不落日志）
        run: node scripts/qa/netlify-env-export.mjs --self-test
      - name: 环境审计器自证（C1 覆盖 / C2 必需项）
        run: node scripts/qa/selfhost-env-audit.mjs --self-test

  # ─────────────────────────────────────────────────────────────
  # 11. 性能基线实跑 —— **仅手动触发**（AC-24）
  #
  #     为什么不是 push/PR 门禁：见上一个 job 的说明。压测在共享 runner 上
  #     的数字**可比性有限**，把它当门槛只会制造随机红灯；把它当**取证**，
  #     人工复核后更新 `docs/implementation/perf-baseline.json` 才有价值。
  #
  #     本 job：隔离库 → 生产构建 → next start → 压测 → SLO 对账，
  #     产物（基线 JSON + 服务端日志）作为 artifact 留存 30 天。
  # ─────────────────────────────────────────────────────────────
  perf-baseline:
    name: Perf 基线实跑（手动）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    env:
      DATABASE_URL: file:./perf-baseline.db
      TURSO_AUTH_TOKEN: ''
      DATABASE_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: 准备隔离库 + 生产构建
        run: bash scripts/perf/prepare-env.sh

      - name: 启动构建产物
        run: |
          DATABASE_URL="file:./perf-baseline.db" npm run start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next-start.pid"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "服务已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::next start 启动超时（60s）"
          tail -100 "$RUNNER_TEMP/next-start.log"
          exit 1

      - name: 压测（写入基线）
        run: |
          node scripts/perf/load-baseline.mjs \
            --base=http://127.0.0.1:3000 \
            --levels=1,10,50 --duration=10 --warmup=3 \
            --out="$RUNNER_TEMP/perf-baseline.json"

      - name: SLO 对账（对着本次实测）
        run: node scripts/perf/slo-check.mjs --baseline="$RUNNER_TEMP/perf-baseline.json"

      - name: 失败时打印服务端日志
        if: failure()
        run: tail -200 "$RUNNER_TEMP/next-start.log" || true

      - name: 上传基线
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline
          path: |
            ${{ runner.temp }}/perf-baseline.json
            ${{ runner.temp }}/next-start.log
          if-no-files-found: ignore
          retention-days: 30
