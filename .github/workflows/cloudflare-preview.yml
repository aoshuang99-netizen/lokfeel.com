name: Cloudflare Preview

# V20.2 P0-01/P0-02：Cloudflare Preview 部署流水线
# 触发器：仅针对 main 的 PR + 手动 workflow_dispatch。
# （已移除 push 触发器：避免每次推 main 自动部署 preview，恢复 PR-only 语义。）
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
# 仅在有 CF 凭据时部署 Preview Worker；无凭据时 deploy 步骤 SKIP（不阻塞）。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  preview:
    name: Build & Deploy Preview (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Verify build artifact
        run: test -f .open-next/worker.js

      - name: Verify preview config
        # 隔离方案：preview 走独立 wrangler 配置（name=lokfeel-preview），不再覆盖生产 worker。
        run: test -f wrangler.preview.jsonc

      - name: Deploy Preview
        # 非阻塞部署到 Cloudflare Workers（preview 子命令是本地 wrangler dev，会阻塞 CI，故用 deploy）。
        # --config 透传给 wrangler deploy，使 preview 部署到独立 worker `lokfeel-preview`，
        # 其 WORKER_SELF_REFERENCE 也指向自身，避免与生产 `lokfeel-app` 互相串扰。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --config wrangler.preview.jsonc
