name: Cloudflare Preview

# V20.2 P0-01/P0-02：Cloudflare Preview 部署流水线
# 触发器：push 到 main / 针对 main 的 PR / 手动触发。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
# 仅在有 CF 凭据时部署 Preview Worker；无凭据时 deploy 步骤 SKIP（不阻塞）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  preview:
    name: Build & Deploy Preview (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Verify build artifact
        run: test -f .open-next/worker.js

      - name: Set preview worker name (隔离生产 worker)
        run: |
          CFG=$(find .open-next -maxdepth 2 -name 'wrangler.json' 2>/dev/null | head -1)
          if [ -n "$CFG" ]; then
            WRANGLER_CFG="$CFG" node -e "const fs=require('fs');const p=process.env.WRANGLER_CFG;const j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='lokfeel-preview';fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('set',p,'name -> lokfeel-preview')"
          else
            echo "warn: .open-next/wrangler.json 未找到，deploy 将使用默认 worker 名"
          fi

      - name: Deploy Preview
        # 非阻塞部署到 Cloudflare Workers（preview 子命令是本地 wrangler dev，会阻塞 CI，故用 deploy）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
