name: Cloudflare Preview

# V20.1 P0-02：Cloudflare Preview 部署流水线
# 触发器：针对 main 的 PR / 手动触发。每次 PR 推送到隔离 Preview Worker。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（最小权限，Preview 作用域）。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # 构建期占位凭证（与 CI 一致），真实密钥经 GitHub Secrets 注入，不写在此处
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  preview:
    name: Build & Deploy Preview (Cloudflare)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Verify build artifact
        run: test -f .open-next/worker.js

      - name: Deploy Preview
        # opennextjs-cloudflare preview 会部署到 Cloudflare 预览环境并返回 Preview URL
        run: npx opennextjs-cloudflare preview

      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const url = process.env.PREVIEW_URL || '(查看 Actions 日志获取 Preview URL)';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🚀 Cloudflare Preview 部署完成：\n${url}`
              });
            } catch (e) {
              core.warning('无法写入 Preview URL 评论：' + e.message);
            }
