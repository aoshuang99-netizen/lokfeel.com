version: 2

updates:
  # ── npm 依赖 ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # 把低风险的小版本更新合并成一个 PR，避免 PR 洪水
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # 大版本升级需人工评估破坏性变更，不自动提 PR
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next-auth'
        update-types: ['version-update:semver-major']
      # ── 已人工固定版本，禁止 dependabot 再提 PR ──────────────────
      # 这两个包的更高版本会引入**静默的类型安全回归**（编译通过但类型失效），
      # 不是"越新越好"，必须锁定：
      #   · zod 4.6.x：z.infer / safeParse 的推断退化为 any，
      #     `instanceof z.ZodError` 不再收窄 —— 错误处理逻辑会静默失去类型保护
      #   · pusher-js 8.6.x：package.json 不再声明 types 字段，TS 找不到类型定义
      # 升级前必须先补齐仓库内所有调用点的显式类型标注，并逐处复核。
      - dependency-name: 'zod'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'pusher-js'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # @types/bcryptjs 是已废弃的 stub（bcryptjs@3 自带类型定义），已从依赖中移除，
      # 防止 dependabot 依据 lock 残留再次提案。
      - dependency-name: '@types/bcryptjs'

  # ── GitHub Actions 自身 ────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'

  # ── Docker 基础镜像 ────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: 'chore(docker)'
