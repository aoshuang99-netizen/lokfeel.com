version: 2

updates:
  # ── npm 依赖 ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # 把低风险的小版本更新合并成一个 PR，避免 PR 洪水
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # 大版本升级需人工评估破坏性变更，不自动提 PR
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next-auth'
        update-types: ['version-update:semver-major']
      # ── 已人工固定版本，禁止 dependabot 再提 PR ──────────────────
      # 这两个包的更高版本会引入**静默的类型安全回归**（编译通过但类型失效），
      # 不是"越新越好"，必须锁定：
      #   · zod 4.6.x：z.infer / safeParse 的推断退化为 any，
      #     `instanceof z.ZodError` 不再收窄 —— 错误处理逻辑会静默失去类型保护
      #   · pusher-js 8.6.x：package.json 不再声明 types 字段，TS 找不到类型定义
      # 升级前必须先补齐仓库内所有调用点的显式类型标注，并逐处复核。
      - dependency-name: 'zod'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'pusher-js'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # @types/bcryptjs 是已废弃的 stub（bcryptjs@3 自带类型定义），已从依赖中移除，
      # 防止 dependabot 依据 lock 残留再次提案。
      - dependency-name: '@types/bcryptjs'
      # typescript 大版本：TS 7 是 Go 原生重写版，但 @typescript-eslint/eslint-plugin
      # (8.58.x) 的 peer 是 ">=4.8.4 <6.1.0"，装上 TS 7 会被 npm 直接移除该插件，
      # `npm run lint` 随之报废（eslint-config-next 依赖它）。
      # 待 @typescript-eslint 官方声明支持后，再人工评估升级。
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @types/node 的大版本必须**跟随运行时 Node 主版本**，不是越新越好：
      # 构建/运行环境是 Node 22（netlify.toml NODE_VERSION、.nvmrc、CI 三处已对齐），
      # 而 dependabot 会按"最新可用"提 26.x —— 那会让 TS 认为能用 Node 24/26 才有的 API，
      # 编译期通过、运行期才炸。只允许 22.x 内的小版本更新。
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # eslint 大版本：ESLint 10 移除了 context.getFilename()，而 eslint-config-next@16.3.6
      # 内嵌的 eslint-plugin-react@7.x 仍在调用它 —— 实测 `npm run lint` 在**任何文件**上
      # 都直接崩（TypeError: contextOrFilename.getFilename is not a function，
      # 连 .ts 非 React 文件也一样），lint 从此报废。注意 tsc 完全看不到这个问题。
      # 待 eslint-config-next 换用兼容 ESLint 10 的 eslint-plugin-react 后再人工评估。
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # nodemailer 大版本：@auth/core 0.41.3 的 peer 是 "^7.0.7 || ^8.0.5"，
      # nodemailer 10 超出上限会让 npm 在 next-auth 下再嵌一份 @auth/core（peer 冲突信号），
      # 且上游只跟到 nodemailer 8。等 @auth/core 放宽范围后再升。
      - dependency-name: 'nodemailer'
        update-types: ['version-update:semver-major']

  # ── GitHub Actions 自身 ────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'

  # ── Docker 基础镜像 ────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: 'chore(docker)'
